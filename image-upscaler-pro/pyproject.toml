[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-upscaler-pro"
version = "1.0.0"
description = "Modern, professional Python image upscaler with batch processing — Real-ESRGAN + Lanczos."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "muhammadilha7m" }]
dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10.3.0",
    "tkinterdnd2>=0.4.2",
    "plyer>=2.1.0",
]

[project.scripts]
image-upscaler-pro = "image_upscaler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default arg (CTk patterns)
    "RUF001", # ambiguous unicode in strings (we use fullwidth glyphs intentionally)
    "RUF002", # docstrings — same rationale
    "RUF003", # comments — same rationale
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
